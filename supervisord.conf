[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; ── Python ML inference API ──────────────────────────────────────────
[program:python-api]
command=python app.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Python API runs on internal port 8000 (change to match your app.py)
environment=PORT="8000",PYTHONUNBUFFERED="1"

; ── Go web server ─────────────────────────────────────────────────────
[program:go-server]
command=/app/server
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Go server listens on 7860 (required by HuggingFace Spaces)
; It proxies /api/* requests to Python on port 8000
environment=PORT="7860",PYTHON_API_URL="http://localhost:8000",STATIC_DIR="/app/static"
